<template>
  <div class="location-detail">
    <!-- begin: title + category/status block (top map layout) -->
    <div class="location-detail__top-view detail-block">
      <div class="location-detail__top-header mdc-theme--text-body">
        <span class="text-ellipsis">
          <h5 class="text-ellipsis margin-top-zero hidden" id="locationContributor">by Someone</h5>
          <h1 class="text-ellipsis">
            Location Title
          </h1>
          <h5 class="text-ellipsis" id="locationSubtitle">Subtitle</h5>
        </span>
        <span class="location-detail__top-header-icons mdc-theme--text-icon-on-background"></span>
      </div>

      <div class="location-detail__top-subtitle">
        <p class="text-truncate mdc-theme--text-primary-on-background">Category | Subcategory</p>
		<div class="location-user-actions">
			<button class="mdc-button mdc-button--unelevated bf-outlined-btn" id="topWorkingHoursBtn">
			  <span class="mdc-button__ripple"></span>
			  <span class="mdc-button__focus-ring"></span>
			  <span class="mdc-button__label">Open</span>
			</button>
			<button class="mdc-button mdc-button--unelevated bf-outlined-btn" id="topLocationSubscribe">
			  <span class="mdc-button__ripple"></span>
			  <span class="mdc-button__focus-ring"></span>
			  <span class="mdc-button__label">Follow</span>
			</button>
		</div>
      </div>
    </div>
    <!-- end: title + category/status block (top map layout) -->

    <!-- begin: media header (top map layout) -->
    <div class="location-detail__map--top-view detail-block detail-block--media" style="height: 300px; margin-left: -16px; margin-right: -16px; margin-top: 6px;"></div>
    <!-- end: media header (top map layout) -->

    <!-- begin: media header + title block (cover layout) -->
    <div class="location-detail__cover detail-block detail-block--media">
      <p class="text-truncate">Category | Subcategory</p>
	  <div class="location-user-actions">
		  <button class="mdc-button mdc-button--unelevated bf-outlined-btn" id="coverWorkingHoursBtn">
			<span class="mdc-button__ripple"></span>
			<span class="mdc-button__focus-ring"></span>
			<span class="mdc-button__label">Open</span>
		  </button>
		  <button class="mdc-button mdc-button--unelevated bf-outlined-btn" id="coverLocationSubscribe">
			<span class="mdc-button__ripple"></span>
			<span class="mdc-button__focus-ring"></span>
			<span class="mdc-button__label">Follow</span>
		  </button>
	  </div>
      <span class="location-cover__rating-value"></span>
      <h4 class="text-ellipsis hidden" id="locationContributorCover">by Someone</h4>
      <h2 class="text-ellipsis">Location Title</h2>
      <h4 class="text-ellipsis" id="locationSubtitleCover">Subtitle</h4>
    </div>
    <!-- end: media header + title block (cover layout) -->

    <!-- begin: primary action row -->
    <div class="location-detail__actions detail-block"></div>
    <!-- end: primary action row -->

    <!-- begin: info rows -->
    <div class="location-detail__address detail-block mdc-theme--text-body">
      <p>Address or Coordinates</p>
      <p id="locationDirectionsBtn">
        -
        <i class="material-icons mdc-theme--text-icon-on-background" tabindex="0" role="button">near_me</i>
      </p>
    </div>
    <!-- end: info rows -->

    <!-- begin: photos -->
    <div class="location-detail__carousel detail-block"></div>
    <!-- end: photos -->

    <!-- begin: reviews -->
    <div class="location-detail__rating detail-block">
      <p bfString="general.rateThisLocation" class="mdc-theme--text-body">Rate This Location</p>
      <div data-rating-id="ratingComponentTest"></div>
    </div>
    <!-- end: reviews -->

    <div class="location-detail__bottom-cover detail-block detail-block--media"></div>

    <!-- begin: description -->
    <div class="location-detail__description detail-block mdc-theme--text-body">
    </div>
    <!-- end: description -->
  </div>
  <div class="location-detail__map detail-block detail-block--media" style="height: 300px; margin-left: -16px; margin-right: -16px; margin-top: 24px;"></div>
</template>
